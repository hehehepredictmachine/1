}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );
  /**
   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;
    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, &quot;data&quot;);
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;
  /** @type {MessagePort | null} */
  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;open-external&quot;, { href });
    }
  };
  const sendFollowUpMessage = ({ context, prompt, title }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };
  /**
   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {
        if (
          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))
        ) {
          throw new TypeError(&quot;Widget state must be a JSON object&quot;);
        }
        return value;
      },
    );
    const parsedState = parse(inputState);
    if (
      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const storedState = {
      modelContent: null,
      privateContent: null,
      ...parsedState,
    };
    const serializedState = stringify(storedState);
    if (encode(serializedState).length &gt; 16 * 1024) {
      throw new TypeError(
        &quot;Widget state must be a JSON object of at most 16 KiB&quot;,
      );
    }
    if (
      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;
      (!isArray(storedState.imageIds) ||
        storedState.imageIds.some(
          (/** @type {unknown} */ id) =&gt; typeof id !== &quot;string&quot;,
        ))
    ) {
      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);
    }
    if (storedState.imageIds?.length &gt; 0) {
      throw Object.assign(
        new TypeError(&quot;Visualization state does not support image attachments&quot;),
        { code: -32602, data: { code: &quot;images_unsupported&quot; } },
      );
    }
    state = storedState;
    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: { widgetState: state } },
      }),
    );
    if (statePersistence === &quot;none&quot;) {
      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost(&quot;scroll-to&quot;, {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();

&lt;style&gt;
#pmw-trading-preview {--pmw-bg:#090d0c;--pmw-side:#0d1210;--pmw-card:#111816;--pmw-card2:#151e1a;--pmw-line:#26362e;--pmw-text:#e8f3ec;--pmw-sub:#a6b8ac;--pmw-muted:#83998b;--pmw-green:#70e5a2;--pmw-green-dark:#172d20;--pmw-red:#ee998e;--pmw-gold:#e0ca88;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;color:var(--pmw-text);font-size:var(--pmw-font-12,12px);line-height:1.35;}
#pmw-trading-preview * {box-sizing:border-box}
#pmw-trading-preview button {font:inherit;color:inherit;cursor:pointer}
#pmw-trading-preview button:focus-visible {outline:2px solid #c8fbd6;outline-offset:2px}
#pmw-trading-preview .desktop {background:var(--pmw-bg);border:1px solid #2a3a30;border-radius:12px;overflow:hidden;box-shadow:0 18px 55px #0004}
#pmw-trading-preview .titlebar {min-height:35px;background:#101713;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid #26342b;color:var(--pmw-muted);font-size:var(--pmw-font-12,12px);gap:10px}
#pmw-trading-preview .title-left,#pmw-trading-preview .title-right,#pmw-trading-preview .row {display:flex;align-items:center;gap:8px}
#pmw-trading-preview .brandmark {display:flex;align-items:center;justify-content:center;color:#a1f1bc;font-weight:800;font-size:var(--pmw-font-12,12px);width:20px;height:20px;border:1px solid #4a7958;border-radius:6px;background:#1a3021}
#pmw-trading-preview .chrome-dot {width:7px;height:7px;border-radius:50%;background:#58665c}
#pmw-trading-preview .shell {display:grid;grid-template-columns:175px minmax(0,1fr);min-width:0}
#pmw-trading-preview .sidebar {background:var(--pmw-side);border-right:1px solid var(--pmw-line);padding:18px 10px 14px;display:flex;flex-direction:column;gap:18px}
#pmw-trading-preview .identity {display:flex;align-items:center;gap:9px;padding:0 5px}
#pmw-trading-preview .emblem {width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:#1d3828;color:var(--pmw-green);font-weight:800;font-size:var(--pmw-font-17,17px);border:1px solid #315941}
#pmw-trading-preview .identity strong {font-size:var(--pmw-font-12,12px);display:block;line-height:1.2}
#pmw-trading-preview .identity small {display:block;color:var(--pmw-muted);font-size:var(--pmw-font-11,11px);margin-top:3px;letter-spacing:.06em}
#pmw-trading-preview .side-label {color:#86978b;letter-spacing:.1em;font-size:var(--pmw-font-11,11px);font-weight:700;margin:0 8px 7px}
#pmw-trading-preview .nav {display:flex;flex-direction:column;gap:3px}
#pmw-trading-preview .nav-item {min-height:34px;display:flex;align-items:center;gap:9px;padding:8px 9px;color:var(--pmw-sub);border-radius:7px;font-size:var(--pmw-font-12,12px);line-height:1.15}
#pmw-trading-preview .nav-item.active {color:#d9f9e3;background:#1a2d21;border-left:2px solid var(--pmw-green);font-weight:650}
#pmw-trading-preview .nav-item i {width:15px;color:#8fa99a;font-style:normal;font-size:var(--pmw-font-13,13px);text-align:center}
#pmw-trading-preview .side-footer {margin-top:auto;padding:11px 9px;border:1px solid var(--pmw-line);border-radius:8px;color:var(--pmw-sub);background:#121c16}
#pmw-trading-preview .side-footer b {display:block;color:#d8e4dc;font-size:var(--pmw-font-12,12px);margin-bottom:3px}
#pmw-trading-preview .main {min-width:0;background:radial-gradient(ellipse at 60% -25%,#173022 0%,#0a100c 42%,#090d0c 80%)}
#pmw-trading-preview .topbar {min-height:58px;border-bottom:1px solid var(--pmw-line);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 18px;flex-wrap:wrap}
#pmw-trading-preview .top-name {font-size:var(--pmw-font-12,12px);font-weight:700;letter-spacing:.06em;color:#cfe0d3}
#pmw-trading-preview .top-sub {display:block;color:var(--pmw-muted);font-size:var(--pmw-font-11,11px);font-weight:400;letter-spacing:0;margin-top:2px}
#pmw-trading-preview .right-head {display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#pmw-trading-preview .status {border:1px solid #34443a;border-radius:6px;background:#131c16;color:#becdc2;padding:5px 7px;font-size:var(--pmw-font-11,11px);white-space:nowrap}
#pmw-trading-preview .status .dot {display:inline-block;width:6px;height:6px;border-radius:50%;background:#99a29b;margin-right:4px}
#pmw-trading-preview .mode {color:#d9c98e}
#pmw-trading-preview .symbols {display:flex;background:#101813;border:1px solid #2b3d31;border-radius:7px;padding:2px;gap:2px}
#pmw-trading-preview .symbols button {border:0;background:transparent;color:#aec0b3;border-radius:5px;padding:5px 8px;font-weight:600;font-size:var(--pmw-font-11,11px);white-space:nowrap}
#pmw-trading-preview .symbols button[aria-pressed=true] {background:#294833;color:#d9ffe5}
#pmw-trading-preview .content {padding:18px;min-width:0}
#pmw-trading-preview .hero {display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
#pmw-trading-preview .eyebrow {font-size:var(--pmw-font-11,11px);letter-spacing:.15em;color:var(--pmw-green);font-weight:700;text-transform:uppercase}
#pmw-trading-preview h1 {font-size:var(--pmw-font-21,21px);line-height:1.2;letter-spacing:-.03em;margin:4px 0 4px}
#pmw-trading-preview .subtitle {color:var(--pmw-sub);font-size:var(--pmw-font-12,12px)}
#pmw-trading-preview .sample-label {background:#302a18;color:#f0d999;border:1px solid #574e2c;border-radius:5px;font-size:var(--pmw-font-11,11px);font-weight:700;padding:5px 8px;letter-spacing:.02em}
#pmw-trading-preview .metrics {display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-bottom:13px}
#pmw-trading-preview .metric {background:#101713;border:1px solid #28382e;border-radius:8px;padding:10px;min-width:0}
#pmw-trading-preview .metric .label {display:block;color:var(--pmw-muted);font-size:var(--pmw-font-11,11px);margin-bottom:6px}
#pmw-trading-preview .metric strong {font-size:var(--pmw-font-15,15px);color:#d8e7dc}
#pmw-trading-preview .metric small {font-size:var(--pmw-font-11,11px);color:#829589;margin-left:4px}
#pmw-trading-preview .workgrid {display:grid;grid-template-columns:minmax(0,1fr) 218px;gap:11px;align-items:start}
#pmw-trading-preview .section-head {display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 8px}
#pmw-trading-preview .section-head strong {font-size:var(--pmw-font-12,12px);letter-spacing:.01em}
#pmw-trading-preview .section-head span {font-size:var(--pmw-font-11,11px);color:var(--pmw-muted)}
#pmw-trading-preview .chart-grid {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
#pmw-trading-preview .chart-card {min-width:0;background:var(--pmw-card);border:1px solid #2a3b30;border-radius:8px;padding:9px;overflow:hidden}
#pmw-trading-preview .chart-title {display:flex;align-items:center;justify-content:space-between;gap:4px;margin-bottom:5px}
#pmw-trading-preview .chart-title b {font-size:var(--pmw-font-12,12px);color:#e4f2e8}

<script>(() => {

    "visualization-share-root",

  let sizeFingerprint = null;
  let sizeWriteTimeout;

    globalThis.location.pathname,

  const sizeStorageKey = `${storageKey}:share-size-v1`;

      new TextEncoder().encode(serializedState).length > 16 * 1024

      state == null ||

        typeof prompt !== "string" ||

  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;

  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!isShare && (!Number.isFinite(height) || height <= viewportHeight)) {

    channel.port1.postMessage({ type: "measure" });

  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );

  const frameHtml = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );

    // Fingerprint the rendered document, including restored widget state, without
    // storing its content. This is a layout cache, not a security identity.
    let hash = 5381;
    for (let index = 0; index < frameHtml.length; index += 1) {

        size.width === frame.clientWidth &&
        size.viewportHeight === globalThis.innerHeight &&
        size.dark ===
          globalThis.matchMedia("(prefers-color-scheme: dark)").matches &&

    }

  delete frame.dataset.srcdoc;
