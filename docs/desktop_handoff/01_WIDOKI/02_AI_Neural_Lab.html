  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-destructive {
  color: var(--destructive);

&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );
  /**
   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;
    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, &quot;data&quot;);
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;
  /** @type {MessagePort | null} */
  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;open-external&quot;, { href });
    }
  };
  const sendFollowUpMessage = ({ context, prompt, title }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };
  /**
   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {
        if (
          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))
        ) {
          throw new TypeError(&quot;Widget state must be a JSON object&quot;);
        }
        return value;
      },
    );
    const parsedState = parse(inputState);
    if (
      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const storedState = {
      modelContent: null,
      privateContent: null,
      ...parsedState,
    };
    const serializedState = stringify(storedState);
    if (encode(serializedState).length &gt; 16 * 1024) {
      throw new TypeError(
        &quot;Widget state must be a JSON object of at most 16 KiB&quot;,
      );
    }
    if (
      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;
      (!isArray(storedState.imageIds) ||
        storedState.imageIds.some(
          (/** @type {unknown} */ id) =&gt; typeof id !== &quot;string&quot;,
        ))
    ) {
      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);
    }
    if (storedState.imageIds?.length &gt; 0) {
      throw Object.assign(
        new TypeError(&quot;Visualization state does not support image attachments&quot;),
        { code: -32602, data: { code: &quot;images_unsupported&quot; } },
      );
    }
    state = storedState;
    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: { widgetState: state } },
      }),
    );
    if (statePersistence === &quot;none&quot;) {
      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost(&quot;scroll-to&quot;, {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();

&lt;style&gt;
#pmw-neural-lab {--lab-bg:#090d0c;--lab-card:#111816;--lab-text:#e8f3ec;--lab-muted:#a4b8a8;--lab-line:#293e30;--lab-accent:#70e5a2;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;font-size:var(--lab-font-12,12px);line-height:1.35;color:var(--lab-text)}
#pmw-neural-lab *{box-sizing:border-box}#pmw-neural-lab [hidden]{display:none!important}#pmw-neural-lab button,#pmw-neural-lab select,#pmw-neural-lab input{font:inherit}#pmw-neural-lab button{cursor:pointer;color:inherit}#pmw-neural-lab button:focus-visible,#pmw-neural-lab select:focus-visible,#pmw-neural-lab input:focus-visible{outline:2px solid #d7ffe3;outline-offset:2px}
#pmw-neural-lab .window{background:var(--lab-bg);border:1px solid #2a3a30;border-radius:12px;overflow:hidden;box-shadow:0 18px 55px #0004}
#pmw-neural-lab .titlebar{min-height:35px;background:#101713;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid var(--lab-line);color:var(--lab-muted);font-size:var(--lab-font-11,11px);gap:8px}
#pmw-neural-lab .title-left,#pmw-neural-lab .window-controls,#pmw-neural-lab .row{display:flex;align-items:center;gap:8px}
#pmw-neural-lab .brandmark{display:grid;place-items:center;width:20px;height:20px;background:#1a3021;border:1px solid #4a7958;color:#a1f1bc;border-radius:6px;font-size:var(--lab-font-12,12px);font-weight:750}
#pmw-neural-lab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#77877a}
#pmw-neural-lab .shell{display:grid;grid-template-columns:172px minmax(0,1fr)}
#pmw-neural-lab .sidebar{background:var(--lab-bg);border-right:1px solid var(--lab-line);padding:17px 10px 14px;display:flex;flex-direction:column;gap:16px}
#pmw-neural-lab .identity{display:flex;align-items:center;gap:9px;padding:0 5px}
#pmw-neural-lab .wizard-icon{width:42px;height:42px;flex:none;background:var(--lab-wizard) center/contain no-repeat #172b1d;border:1px solid #315941;border-radius:11px}
#pmw-neural-lab .identity strong{font-size:var(--lab-font-12,12px);line-height:1.2}#pmw-neural-lab .identity small{display:block;color:var(--lab-muted);font-size:var(--lab-font-11,11px);margin-top:3px;letter-spacing:.05em}
#pmw-neural-lab .side-label{color:#94a99b;letter-spacing:.09em;font-size:var(--lab-font-11,11px);font-weight:700;margin:0 8px 7px}
#pmw-neural-lab .nav{display:flex;flex-direction:column;gap:3px}#pmw-neural-lab .nav-item{display:flex;align-items:center;gap:8px;min-height:34px;padding:7px 9px;color:#afc2b4;border-radius:7px;font-size:var(--lab-font-12,12px)}
#pmw-neural-lab .nav-item i{font-style:normal;width:16px;text-align:center;color:#91a99a}#pmw-neural-lab .nav-item.active{background:#1a2d21;border-left:2px solid var(--lab-accent);color:#dcf7e4;font-weight:650}
#pmw-neural-lab .side-footer{margin-top:auto;padding:10px;border:1px solid var(--lab-line);border-radius:8px;background:#121c16;color:var(--lab-muted)}#pmw-neural-lab .side-footer b{display:block;color:#dce9df;margin-bottom:4px}
#pmw-neural-lab .main{min-width:0;background:radial-gradient(ellipse at 60% -25%,#17302288,transparent 48%),var(--lab-bg)}
#pmw-neural-lab .topbar{min-height:58px;border-bottom:1px solid var(--lab-line);display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 16px;flex-wrap:wrap}
#pmw-neural-lab .top-name{font-weight:700;letter-spacing:.05em;font-size:var(--lab-font-11,11px)}#pmw-neural-lab .top-name small{display:block;color:var(--lab-muted);font-size:var(--lab-font-11,11px);letter-spacing:0;font-weight:400;margin-top:2px}
#pmw-neural-lab .right-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap}#pmw-neural-lab .status{border:1px solid #34443a;border-radius:6px;background:#131c16;color:#c4d2c8;padding:5px 6px;white-space:nowrap;font-size:var(--lab-font-11,11px)}#pmw-neural-lab .status.mode{color:#e1cf94}
#pmw-neural-lab .symbols{display:flex;background:#101813;border:1px solid #2b3d31;border-radius:7px;padding:2px;gap:2px}#pmw-neural-lab .symbols button{border:0;background:transparent;color:#becfc2;border-radius:5px;padding:5px 8px;font-size:var(--lab-font-11,11px)}
#pmw-neural-lab .symbols button[aria-pressed=true]{background:#294833;color:#e1ffea}
#pmw-neural-lab .content{padding:15px;min-width:0}
#pmw-neural-lab .hero{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 14px 11px 16px;min-height:103px;background:radial-gradient(ellipse at 88% 40%,#23513688,transparent 65%),var(--lab-card);border:1px solid #33533b;border-radius:10px}
#pmw-neural-lab .hero-copy{min-width:0}#pmw-neural-lab .eyebrow{color:var(--lab-accent);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:var(--lab-font-11,11px)}
#pmw-neural-lab h1{font-size:var(--lab-font-21,21px);line-height:1.2;letter-spacing:-.02em;margin:4px 0}#pmw-neural-lab .subtitle{color:#c3d6c8;font-size:var(--lab-font-12,12px)}
#pmw-neural-lab .hero-actions{display:flex;align-items:center;gap:7px;margin-top:8px;flex-wrap:wrap}#pmw-neural-lab .badge{background:#302a18;color:#f1d99b;border:1px solid #574e2c;border-radius:5px;padding:4px 7px;font-size:var(--lab-font-11,11px);font-weight:650}
#pmw-neural-lab .art{width:102px;height:98px;flex:none;background:var(--lab-wizard) center/contain no-repeat;filter:drop-shadow(0 0 9px #47d67848)}
#pmw-neural-lab .utility{background:#1b3022;border:1px solid var(--lab-accent);border-radius:6px;padding:5px 8px;color:#e1f2e4}
#pmw-neural-lab .appearance{padding:10px;margin-top:8px;background:var(--lab-card);border:1px solid var(--lab-line);border-radius:8px}#pmw-neural-lab .appearance-fields{display:flex;align-items:end;gap:8px;flex-wrap:wrap}
#pmw-neural-lab .appearance label{display:flex;flex-direction:column;gap:4px;color:#becfc3}#pmw-neural-lab input[type=color]{width:42px;height:31px;padding:2px;border:1px solid #45634d;border-radius:5px;background:#17251b}
#pmw-neural-lab select{font:inherit;color:#e8f3ec;background:#17251b;border:1px solid #45634d;border-radius:6px;padding:6px;max-width:100%}#pmw-neural-lab .save-note{display:block;color:#c2d2c6;margin-top:6px}#pmw-neural-lab .save-note:empty{display:none}
#pmw-neural-lab .subnav{display:flex;gap:5px;margin:12px 0 10px;flex-wrap:wrap;border-bottom:1px solid var(--lab-line);padding-bottom:9px}
#pmw-neural-lab .subnav button{border:1px solid transparent;border-radius:6px;padding:7px 9px;background:transparent;color:#b5c8b9}
#pmw-neural-lab .subnav button[aria-pressed=true]{color:#eaffed;background:#1b3323;border-color:#39694a}
#pmw-neural-lab .workbench{display:grid;grid-template-columns:145px minmax(0,1fr) 176px;gap:9px;align-items:start}
#pmw-neural-lab .family-panel,#pmw-neural-lab .details-panel,#pmw-neural-lab .studio,#pmw-neural-lab .sheet{background:var(--lab-card);border:1px solid var(--lab-line);border-radius:8px;min-width:0}
#pmw-neural-lab .family-panel,#pmw-neural-lab .details-panel{padding:10px}

    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  if (isShare && storage != null) {
    // Fingerprint the rendered document, including restored widget state, without
    // storing its content. This is a layout cache, not a security identity.
    let hash = 5381;
    for (let index = 0; index < frameHtml.length; index += 1) {
      hash = (hash * 33 + frameHtml.charCodeAt(index)) % 4_294_967_296;
    }
    sizeFingerprint = hash.toString(36);
    try {
      const size = JSON.parse(storage.getItem(sizeStorageKey) ?? "null");
      if (
        size?.fingerprint === sizeFingerprint &&
        size.width === frame.clientWidth &&
        size.viewportHeight === globalThis.innerHeight &&
        size.dark ===
          globalThis.matchMedia("(prefers-color-scheme: dark)").matches &&
        size.scale === globalThis.devicePixelRatio &&
        typeof size.height === "number" &&
        Number.isFinite(size.height) &&
        size.height >= 0 &&
        size.height <= 10_000
      ) {
        frame.style.height = size.height + "px";
      }
    } catch {
      // Ignore missing or invalid cache entries and measure the live frame.
    }
  }
  frame.srcdoc = frameHtml;
  delete frame.dataset.srcdoc;
})();
